# The Shopping Assistant evals: 40 questions asked of a real Claude model and scored (tests/ShoppingAssistant.Evals).
# See .scratch/evals/spec.md, "CI".
name: Shopping Assistant evals

on:
  # No paths filter here: the check always reports, and the "Decide" step skips the evals when nothing changed.
  # Never pull_request_target: PR code must never run with this repository's secrets.
  pull_request:
  push:
    branches: [main] # runs on main seed the cache that PR runs restore
  workflow_dispatch:
    inputs:
      fresh:
        description: Ignore cached responses and sample every case again
        type: boolean
        default: false

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: evals # holds ANTHROPIC_API_KEY: a CI-only key in its own workspace, with a spend limit
    outputs:
      ran: ${{ steps.decide.outputs.ran }}
    env:
      ESHOP_EVALS_STORE: ${{ github.workspace }}/artifacts/evals-store # the results store and the response cache
      EVALS_OUT: ${{ github.workspace }}/artifacts/evals-out # what this run uploads: summary.md, evals.json, report.html
      DOTNET_AIEVAL_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # a PR's merge commit and its base, to list the PR's changes

      - name: Decide whether to run
        id: decide
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }} # false on fork and Dependabot PRs, which get no secrets
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p "$EVALS_OUT"
          case "$EVENT" in
            pull_request) changed=$(git diff --name-only HEAD^1 HEAD) ;; # the merge commit against its base
            push) changed=$(git fetch --no-tags --depth=1 origin "$BEFORE" && git diff --name-only "$BEFORE" HEAD || echo "unknown") ;;
            *) changed="" ;;
          esac
          # The assistant: the chat component, WebApp's chat registration, the tools, policy-api, the Policies,
          # the eval project and this workflow. An unknown diff counts as a change.
          assistant=$(printf '%s\n' "$changed" | grep -E '^(src/WebApp/Components/Chatbot/|src/WebApp/Extensions/|src/eShop\.Assistant\.Tools/|src/Policy\.API/|policies/|tests/ShoppingAssistant\.Evals/|\.github/workflows/evals\.yml$|unknown$)' || true)
          if [ "$HAS_KEY" != "true" ]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Evals not run: no API key on this PR." > "$EVALS_OUT/summary.md"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ -n "$assistant" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
            printf 'Assistant changes:\n%s\n' "${assistant:-(manual run)}"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Evals not run: no assistant changes." > "$EVALS_OUT/summary.md"
          fi

      - name: Setup .NET (global.json)
        if: steps.decide.outputs.ran == 'true'
        uses: actions/setup-dotnet@v4

      # The most recent cache visible to this run (this ref's, then the base branch's). A rerun gets a new key
      # through run_attempt, so it restores the first attempt's store and can save its own.
      - name: Restore the results store
        if: steps.decide.outputs.ran == 'true' && !inputs.fresh
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ESHOP_EVALS_STORE }}
          key: evals-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: evals-

      - name: Build
        if: steps.decide.outputs.ran == 'true'
        run: |
          dotnet tool restore
          dotnet build tests/ShoppingAssistant.Evals

      # Fails when the gate fails. The project writes summary.md and evals.json at the root of the store.
      - name: Run the evals
        if: steps.decide.outputs.ran == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # this step only
          ESHOP_EVALS: 1
          ESHOP_EVALS_FRESH: ${{ inputs.fresh && '1' || '' }}
        run: |
          # A restored store holds the previous run's summary; this run must not show it if it writes none.
          rm -f "$ESHOP_EVALS_STORE/summary.md" "$ESHOP_EVALS_STORE/evals.json"
          dotnet test --project tests/ShoppingAssistant.Evals --no-build

      - name: HTML report and cache cleanup
        if: always() && steps.decide.outputs.ran == 'true'
        run: |
          mkdir -p "$ESHOP_EVALS_STORE"
          for file in summary.md evals.json; do
            if [ -f "$ESHOP_EVALS_STORE/$file" ]; then cp "$ESHOP_EVALS_STORE/$file" "$EVALS_OUT/"; fi
          done
          if [ ! -f "$EVALS_OUT/summary.md" ]; then
            echo "Evals did not finish: no summary was written. See the job log." > "$EVALS_OUT/summary.md"
          fi
          dotnet aieval report -p "$ESHOP_EVALS_STORE" -o "$EVALS_OUT/report.html"
          # The store is saved under a new key each run, so prune it: expired cache entries, and every run's
          # results but the 5 most recent, which the next report shows side by side.
          dotnet aieval clean-cache -p "$ESHOP_EVALS_STORE"
          dotnet aieval clean-results -p "$ESHOP_EVALS_STORE" -n 5

      - name: Save the results store
        if: always() && steps.decide.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ESHOP_EVALS_STORE }}
          key: evals-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Job summary
        if: always()
        run: cat "$EVALS_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the summary, badge and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals
          path: ${{ env.EVALS_OUT }}
          if-no-files-found: ignore

  # The sticky PR comment: summary.md, posted once and edited in place on later runs. A separate job so the token
  # that can write to the PR never shares a job with the key, and no PR code runs here (nothing is checked out).
  # Only PRs from this repository: a fork's token can't comment, and Dependabot's is read-only.
  comment:
    needs: evals
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download the summary
        uses: actions/download-artifact@v4
        continue-on-error: true # a run that uploaded nothing still gets a comment
        with:
          name: evals
          path: evals-out

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.evals.result }}
          RAN: ${{ needs.evals.outputs.ran }}
        run: |
          marker='<!-- shopping-assistant-evals -->'
          {
            echo "$marker"
            if [ -f evals-out/summary.md ]; then
              head -c 60000 evals-out/summary.md # a comment holds at most 65,536 characters
            else
              echo "Evals did not finish (job result: $RESULT): no summary was uploaded."
            fi
            echo
            echo "---"
            if [ "$RAN" = "true" ]; then
              echo "[Run log]($RUN_URL). The HTML report is in the run's \`evals\` artifact."
            else
              echo "[Run log]($RUN_URL)."
            fi
          } > body.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@body.md --jq .html_url
          fi

  # The README badge: on a push to main where the evals ran, evals.json goes to the badges branch (an orphan branch
  # holding only that file), which shields.io reads. An unchanged badge commits nothing.
  badge:
    needs: evals
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.evals.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the badge
        uses: actions/download-artifact@v4
        with:
          name: evals
          path: evals-out

      - uses: actions/checkout@v4
        with:
          ref: badges
          path: badges

      - name: Commit evals.json if it changed
        working-directory: badges
        env:
          SHA: ${{ github.sha }}
        run: |
          if [ ! -f ../evals-out/evals.json ]; then
            echo "::notice::No evals.json: the run didn't finish, so the badge keeps its last score."
            exit 0
          fi
          cp ../evals-out/evals.json evals.json
          if git diff --quiet -- evals.json; then
            echo "The badge is unchanged: nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Evals badge: $(jq -r .message evals.json), from $SHA" -- evals.json
          git push origin HEAD:badges
